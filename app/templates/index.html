<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionRPSHand - 猜拳游戏</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 15px 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .video-section {
            flex: 2;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .video-section img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .status-section {
            flex: 1;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }

        .countdown {
            font-size: 64px;
            font-weight: bold;
            color: #e74c3c;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gesture-display {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .gesture-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #ecf0f1;
            border-radius: 8px;
            margin: 0 5px;
        }

        .gesture-item:first-child {
            margin-left: 0;
        }

        .gesture-item:last-child {
            margin-right: 0;
        }

        .gesture-emoji {
            font-size: 36px;
            display: block;
        }

        .gesture-name {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scores {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .score-item {
            flex: 1;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }

        .score-label {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .hand-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-indicator.connected {
            background: #27ae60;
        }

        .detected-gesture {
            text-align: center;
            font-size: 48px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detected-text {
            font-size: 14px;
            color: #7f8c8d;
            text-align: center;
            margin-top: 5px;
        }

        .high-scores {
            max-height: 200px;
            overflow-y: auto;
        }

        .high-score-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ecf0f1;
            font-size: 13px;
        }

        .high-score-item:last-child {
            border-bottom: none;
        }

        .game-over-reason {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .status-section {
                max-width: none;
            }

            .countdown {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">连接中...</div>

    <div class="header">
        <h1>🎮 VisionRPSHand - 猜拳游戏</h1>
    </div>

    <div class="container">
        <div class="video-section">
            <img src="/video_feed" alt="摄像头画面" id="videoFeed">
        </div>

        <div class="status-section">
            <!-- 游戏状态 -->
            <div class="panel">
                <div class="panel-title">游戏状态</div>
                <div id="gameStateDisplay" style="text-align: center; padding: 10px;">
                    做出 👌 OK手势开始游戏
                </div>
                <div id="gameOverReason" class="game-over-reason" style="display: none;"></div>
            </div>

            <!-- 倒计时 -->
            <div class="panel" id="countdownPanel" style="display: none;">
                <div class="panel-title">倒计时</div>
                <div class="countdown" id="countdown"></div>
            </div>

            <!-- 检测到的手势 -->
            <div class="panel">
                <div class="panel-title">检测到的手势</div>
                <div class="detected-gesture" id="detectedEmoji">-</div>
                <div class="detected-text" id="detectedName">等待手势...</div>
            </div>

            <!-- 本局手势 -->
            <div class="panel" id="gesturePanel" style="display: none;">
                <div class="panel-title">本局手势</div>
                <div class="gesture-display">
                    <div class="gesture-item">
                        <span class="gesture-emoji" id="userEmoji">-</span>
                        <span class="gesture-name">你的手势</span>
                    </div>
                    <div class="gesture-item">
                        <span class="gesture-emoji" id="machineEmoji">-</span>
                        <span class="gesture-name">机器手势</span>
                    </div>
                </div>
            </div>

            <!-- 结果 -->
            <div class="panel" id="resultPanel" style="display: none;">
                <div class="panel-title">结果</div>
                <div class="result" id="result"></div>
            </div>

            <!-- 当前比分 -->
            <div class="panel" id="scorePanel" style="display: none;">
                <div class="panel-title">当前比分</div>
                <div class="scores">
                    <div class="score-item">
                        <div class="score-value" id="userScore">0</div>
                        <div class="score-label">你</div>
                    </div>
                    <div class="score-item">
                        <div class="score-value" id="machineScore">0</div>
                        <div class="score-label">机器</div>
                    </div>
                </div>
            </div>

            <!-- 历史最高分 -->
            <div class="panel">
                <div class="panel-title">历史最高分</div>
                <div class="high-scores" id="highScores">
                    <div style="text-align: center; color: #7f8c8d;">暂无记录</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GESTURE_EMOJI = {
            'rock': '✊',
            'paper': '✋',
            'scissors': '✌️',
            'thumb': '👍',
            'ok': '👌'
        };

        const GESTURE_NAMES = {
            'rock': '石头',
            'paper': '布',
            'scissors': '剪刀',
            'thumb': '拇指',
            'ok': 'OK'
        };

        // WebSocket连接
        const socket = io({
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });

        socket.on('connect', () => {
            console.log('已连接到服务器');
            updateConnectionStatus(true);
        });

        socket.on('disconnect', () => {
            console.log('与服务器断开连接');
            updateConnectionStatus(false);
        });

        socket.on('connect_error', (error) => {
            console.error('连接错误:', error);
            updateConnectionStatus(false);
        });

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connectionStatus');
            if (connected) {
                status.textContent = '已连接';
                status.style.background = 'rgba(39, 174, 96, 0.9)';
            } else {
                status.textContent = '连接中...';
                status.style.background = 'rgba(231, 76, 60, 0.9)';
            }
        }

        // 高分记录
        socket.on('high_scores', (data) => {
            const container = document.getElementById('highScores');
            if (data.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #7f8c8d;">暂无记录</div>';
                return;
            }

            container.innerHTML = data.map((record, index) => `
                <div class="high-score-item">
                    <span>#${index + 1} ${record.date.split(' ')[1]}</span>
                    <span>${record.user_score} - ${record.machine_score}</span>
                    <span>+${record.difference}</span>
                </div>
            `).join('');
        });

        // 游戏状态
        socket.on('game_state', (data) => {
            const stateDisplay = document.getElementById('gameStateDisplay');
            const countdownPanel = document.getElementById('countdownPanel');
            const gesturePanel = document.getElementById('gesturePanel');
            const resultPanel = document.getElementById('resultPanel');
            const scorePanel = document.getElementById('scorePanel');
            const gameOverReason = document.getElementById('gameOverReason');

            // 隐藏结束原因
            gameOverReason.style.display = 'none';

            switch(data.state) {
                case 'monitoring':
                    stateDisplay.textContent = '做出 👌 OK手势开始游戏';
                    countdownPanel.style.display = 'none';
                    gesturePanel.style.display = 'none';
                    resultPanel.style.display = 'none';
                    scorePanel.style.display = 'none';
                    break;

                case 'countdown':
                    stateDisplay.textContent = '倒计时中...';
                    countdownPanel.style.display = 'block';
                    gesturePanel.style.display = 'none';
                    resultPanel.style.display = 'none';
                    scorePanel.style.display = 'block';
                    break;

                case 'result':
                    stateDisplay.textContent = '本局结果';
                    gesturePanel.style.display = 'block';
                    resultPanel.style.display = 'block';
                    break;

                case 'paused':
                    stateDisplay.textContent = '准备下一局...';
                    break;

                case 'game_over':
                    stateDisplay.textContent = '游戏结束';
                    if (data.reason) {
                        gameOverReason.textContent = data.reason;
                        gameOverReason.style.display = 'block';
                    }
                    break;
            }
        });

        // 倒计时
        socket.on('countdown', (data) => {
            document.getElementById('countdown').textContent = data.countdown;
        });

        // 检测到的手势
        socket.on('detected_gesture', (data) => {
            document.getElementById('detectedEmoji').textContent = data.emoji || '-';
            document.getElementById('detectedName').textContent = data.name || '等待手势...';
        });

        // 本局手势
        socket.on('gestures', (data) => {
            const userEmoji = document.getElementById('userEmoji');
            const machineEmoji = document.getElementById('machineEmoji');

            userEmoji.textContent = data.user ? GESTURE_EMOJI[data.user] : '-';
            machineEmoji.textContent = data.machine ? GESTURE_EMOJI[data.machine] : '-';
        });

        // 结果
        socket.on('result', (data) => {
            document.getElementById('result').textContent = data.text;
            document.getElementById('result').style.color = data.color;
        });

        // 分数
        socket.on('scores', (data) => {
            document.getElementById('userScore').textContent = data.user;
            document.getElementById('machineScore').textContent = data.machine;
        });
    </script>
</body>
</html>
