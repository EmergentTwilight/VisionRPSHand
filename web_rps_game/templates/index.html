<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionRPSHand - 321猜拳游戏</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 15px 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .video-section {
            flex: 2;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .video-section img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .status-section {
            flex: 1;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
        }

        .countdown {
            font-size: 64px;
            font-weight: bold;
            color: #e74c3c;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gesture-display {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .gesture-item {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #ecf0f1;
            border-radius: 8px;
            margin: 0 5px;
        }

        .gesture-item:first-child {
            margin-left: 0;
        }

        .gesture-item:last-child {
            margin-right: 0;
        }

        .gesture-emoji {
            font-size: 36px;
            display: block;
        }

        .gesture-name {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scores {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .score-item {
            flex: 1;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #3498db;
        }

        .score-label {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }

        .hand-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-indicator.connected {
            background: #27ae60;
        }

        .start-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .start-btn:hover {
            background: #2ecc71;
            transform: translateY(-2px);
        }

        .start-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        .quit-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .quit-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .status-section {
                max-width: none;
            }

            .countdown {
                font-size: 48px;
            }
        }

        /* 连接状态 */
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">连接中...</div>

    <div class="header">
        <h1>🎮 VisionRPSHand - 321猜拳游戏</h1>
    </div>

    <div class="container">
        <div class="video-section">
            <img src="/video_feed" alt="摄像头画面" id="videoFeed">
        </div>

        <div class="status-section">
            <!-- 倒计时 -->
            <div class="panel">
                <div class="panel-title">倒计时</div>
                <div class="countdown" id="countdown"></div>
            </div>

            <!-- 手势显示 -->
            <div class="panel">
                <div class="panel-title">本局手势</div>
                <div class="gesture-display">
                    <div class="gesture-item">
                        <span class="gesture-emoji" id="userEmoji">-</span>
                        <span class="gesture-name">你的手势</span>
                    </div>
                    <div class="gesture-item">
                        <span class="gesture-emoji" id="machineEmoji">-</span>
                        <span class="gesture-name">机器手势</span>
                    </div>
                </div>
            </div>

            <!-- 结果 -->
            <div class="panel">
                <div class="panel-title">结果</div>
                <div class="result" id="result"></div>
            </div>

            <!-- 统计 -->
            <div class="panel">
                <div class="panel-title">统计</div>
                <div class="scores">
                    <div class="score-item">
                        <div class="score-value" id="userScore">0</div>
                        <div class="score-label">你胜</div>
                    </div>
                    <div class="score-item">
                        <div class="score-value" id="machineScore">0</div>
                        <div class="score-label">机器胜</div>
                    </div>
                    <div class="score-item">
                        <div class="score-value" id="tieScore">0</div>
                        <div class="score-label">平局</div>
                    </div>
                </div>
            </div>

            <!-- 灵巧手状态 -->
            <div class="panel">
                <div class="panel-title">灵巧手</div>
                <div class="hand-status">
                    <div class="status-indicator" id="handIndicator"></div>
                    <span id="handStatusText">未连接</span>
                </div>
            </div>

            <!-- 开始按钮 -->
            <button class="start-btn" id="startBtn">🎲 开始游戏</button>
        </div>
    </div>

    <script>
        const GESTURE_EMOJI = {
            'rock': '✊',
            'paper': '✋',
            'scissors': '✌️'
        };

        const GESTURE_NAMES = {
            'rock': '石头',
            'paper': '布',
            'scissors': '剪刀'
        };

        // WebSocket连接
        const socket = io({
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });

        // 连接事件
        socket.on('connect', () => {
            console.log('已连接到服务器，Socket ID:', socket.id);
            updateConnectionStatus(true);
        });

        socket.on('disconnect', () => {
            console.log('与服务器断开连接');
            updateConnectionStatus(false);
        });

        socket.on('connect_error', (error) => {
            console.error('连接错误:', error);
            updateConnectionStatus(false);
        });

        let gameState = 'idle';

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connectionStatus');
            if (connected) {
                status.textContent = '已连接';
                status.style.background = 'rgba(39, 174, 96, 0.9)';
            } else {
                status.textContent = '连接中...';
                status.style.background = 'rgba(231, 76, 60, 0.9)';
            }
        }

        // 服务器确认连接
        socket.on('connected', (data) => {
            console.log('服务器确认:', data);
        });

        // 灵巧手状态
        socket.on('hand_status', (data) => {
            const indicator = document.getElementById('handIndicator');
            const text = document.getElementById('handStatusText');
            if (data.connected) {
                indicator.classList.add('connected');
                text.textContent = '已连接';
            } else {
                indicator.classList.remove('connected');
                text.textContent = '未连接';
            }
        });

        // 游戏状态
        socket.on('game_state', (data) => {
            gameState = data.state;
            document.getElementById('startBtn').disabled = (data.state !== 'idle');
        });

        // 倒计时
        socket.on('countdown', (data) => {
            document.getElementById('countdown').textContent = data.countdown;
        });

        // 手势
        socket.on('gestures', (data) => {
            const userEmoji = document.getElementById('userEmoji');
            const machineEmoji = document.getElementById('machineEmoji');

            if (data.user) {
                userEmoji.textContent = GESTURE_EMOJI[data.user];
            } else {
                userEmoji.textContent = '-';
            }

            if (data.machine) {
                machineEmoji.textContent = GESTURE_EMOJI[data.machine];
            } else {
                machineEmoji.textContent = '-';
            }
        });

        // 结果
        socket.on('result', (data) => {
            document.getElementById('result').textContent = data.text;
            document.getElementById('result').style.color = data.color;
        });

        // 分数
        socket.on('scores', (data) => {
            document.getElementById('userScore').textContent = data.user;
            document.getElementById('machineScore').textContent = data.machine;
            document.getElementById('tieScore').textContent = data.tie;
        });

        // 开始游戏
        document.getElementById('startBtn').addEventListener('click', () => {
            socket.emit('start_game');
        });

        // 服务器消息
        socket.on('server_message', (data) => {
            console.log('服务器消息:', data);
        });
    </script>
</body>
</html>
